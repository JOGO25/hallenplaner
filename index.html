<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17365d"><link rel="manifest" href="./manifest.webmanifest"><title>Hallenplaner 2026/27</title><style>
:root{font-family:system-ui,sans-serif;color:#203047;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#17365d;color:white;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:1.3rem;margin:0}main{max-width:1200px;margin:auto;padding:15px}.panel{background:white;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:0 1px 5px #0001}button,input,select{font:inherit;padding:9px;border:1px solid #ccd4e0;border-radius:7px}button{cursor:pointer;background:#edf3fa}button.primary{background:#1761a0;color:white}button.danger{color:#a31d30}button:disabled{opacity:.45}input,select{max-width:100%}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.muted{color:#657387;font-size:.9rem}.scroll{overflow-x:auto}.calendar{display:grid;grid-template-columns:65px repeat(7,minmax(115px,1fr));min-width:875px}.cell,.time,.head{border-bottom:1px solid #e3e7ee;border-right:1px solid #e3e7ee;min-height:51px;padding:3px}.head{background:#e7eef7;font-weight:bold;text-align:center;position:sticky;top:0}.time{font-size:.8rem;color:#53657a}.event{font-size:.75rem;border-radius:5px;padding:4px;margin:1px;cursor:pointer;background:#d2e6ff}.event.klein{background:#c9efdb}.event.willi{background:#ffe4b9}.event.assigned{outline:2px solid #43865b}.event.active{outline:2px solid #1b304d}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px}.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #eee;gap:8px}.bar{height:12px;background:#e5eaf0;border-radius:9px;overflow:hidden;margin:3px 0 12px}.fill{height:100%;background:#5b92d4}.hidden{display:none!important}label{display:block;margin:8px 0}.tag{padding:3px 7px;border-radius:5px;background:#edf3fa}@media(max-width:800px){.layout{display:block}header{flex-wrap:wrap}.calendar{grid-template-columns:65px repeat(7,115px)}} </style></head>
<body><header><h1>⚽ Hallenplaner 2026/27</h1><span id="identity"></span><button id="logout" class="hidden">Abmelden</button></header><main><p id="message" class="muted"></p>
<section id="login" class="panel"><h2>Anmelden</h2><form id="loginForm"><label>E-Mail <input id="email" type="email" required autocomplete="username"></label><label>Passwort <input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Anmelden</button></form><p class="muted">Die Zugangsdaten erhältst du vom Administrator.</p></section>
<section id="app" class="hidden"><div class="panel toolbar"><button id="prev">◀</button><strong id="weekTitle"></strong><button id="next">▶</button><button id="start">Saisonstart</button><button id="showCalendar">Kalender</button><button id="showStats">Statistik</button><button id="reload">Aktualisieren</button></div>
<div id="calendarView" class="layout"><div class="panel scroll"><div id="calendar" class="calendar"></div></div><aside class="panel"><div id="detail">Wähle einen Termin aus.</div><div id="admin" class="hidden"><hr><h3>Admin-Werkzeuge</h3><button id="add">Termin hinzufügen</button><button id="deleteWeek" class="danger">Woche löschen</button></div></aside></div>
<div id="statsView" class="panel hidden"><h2>Hallennutzung</h2><label>Halle <select id="statHall"><option value="all">Alle Hallen</option><option value="gross">Große Leibniz</option><option value="klein">Kleine Leibniz</option><option value="willi">Willi-Bull</option></select></label><label>Zeitraum <select id="statPeriod"><option value="all">Gesamte Saison</option><option value="week">Aktuelle Woche</option></select></label><div id="stats"></div><button id="csv">CSV exportieren</button></div></section>
<dialog id="dialog"><form id="addForm"><h3>Hallenzeit hinzufügen</h3><label>Datum <input id="newDate" type="date" min="2026-10-19" max="2027-03-31" required></label><label>Halle <select id="newHall"><option value="gross">Große Leibniz</option><option value="klein">Kleine Leibniz</option><option value="willi">Willi-Bull</option></select></label><label>Beginn <input id="newStart" type="time" step="1800" value="16:00" required></label><label>Ende <input id="newEnd" type="time" step="1800" value="17:00" required></label><button class="primary">Hinzufügen</button><button type="button" id="cancel">Abbrechen</button></form></dialog>
</main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.49.1';import{SUPABASE_URL,SUPABASE_ANON_KEY}from'./config.js';
const $=id=>document.getElementById(id),START='2026-10-19',END='2027-03-31',teams=['G','F','E','D'],names={G:'G-Jugend',F:'F-Jugend',E:'E-Jugend',D:'D-Jugend'},halls={gross:'Große Leibniz-Halle',klein:'Kleine Leibniz-Halle',willi:'Willi-Bull-Halle'};
const ready=SUPABASE_URL.startsWith('https://')&&!SUPABASE_ANON_KEY.startsWith('HIER_'),db=ready?createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),date=s=>new Date(s+'T12:00:00'),add=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return iso(d)},monday=s=>add(s,-(date(s).getDay()+6)%7),minutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3,5)),clock=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
let week=START,profile=null,slots=[],apps=[],selected=null,view='calendar';
function msg(s){$('message').textContent=s||''}function fail(e){msg('Fehler: '+(e?.message||e))}async function fetchData(){const [a,b]=await Promise.all([db.from('slots').select('*').gte('day',START).lte('day',END).order('day').range(0,4999),db.from('applications').select('*').range(0,4999)]);if(a.error||b.error)throw a.error||b.error;slots=a.data;apps=b.data}
async function refresh(){try{await fetchData();render();msg('')}catch(e){fail(e)}}
async function authenticate(){const{data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.add('hidden');$('logout').classList.toggle('hidden',!session);if(!session)return;try{const r=await db.from('profiles').select('*').eq('id',session.user.id).single();if(r.error)throw r.error;profile=r.data;if(!['trainer','admin'].includes(profile.role)){msg('Zugang wartet auf Freigabe durch den Administrator.');return}$('identity').textContent=profile.role==='admin'?'Admin':names[profile.team];$('admin').classList.toggle('hidden',profile.role!=='admin');$('app').classList.remove('hidden');await refresh()}catch(e){fail(e)}}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!db)return;const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)fail(r.error);else await authenticate()};$('logout').onclick=async()=>{await db.auth.signOut();await authenticate()};
function render(){let end=add(week,6);$('weekTitle').textContent=week+' bis '+end;$('prev').disabled=week<=START;$('next').disabled=week>=monday(END);$('calendarView').classList.toggle('hidden',view!=='calendar');$('statsView').classList.toggle('hidden',view!=='stats');if(view==='stats'){stats();return}let days=Array.from({length:7},(_,i)=>add(week,i));let html='<div class="head">Zeit</div>'+days.map((d,i)=>'<div class="head">'+['Mo','Di','Mi','Do','Fr','Sa','So'][i]+'<br>'+d.slice(8)+'.'+d.slice(5,7)+'</div>').join('');for(let t=840;t<1320;t+=30){html+='<div class="time">'+clock(t)+'</div>';for(let d of days){let entries=slots.filter(s=>s.day===d&&minutes(s.start_time)===t);html+='<div class="cell" data-day="'+d+'" data-time="'+clock(t)+'">'+entries.map(s=>'<div class="event '+s.hall+(s.assigned_team?' assigned':'')+(s.id===selected?' active':'')+'" data-id="'+s.id+'">'+(s.hall==='gross'?'Große':s.hall==='klein'?'Kleine':'Willi-Bull')+'<br>'+(s.assigned_team?names[s.assigned_team]:apps.filter(a=>a.slot_id===s.id).length+' Wünsche')+'</div>').join('')+'</div>'}}$('calendar').innerHTML=html;document.querySelectorAll('.event').forEach(el=>el.onclick=e=>{e.stopPropagation();selected=Number(el.dataset.id);render()});document.querySelectorAll('.cell').forEach(el=>el.onclick=()=>{if(profile.role!=='admin')return;$('newDate').value=el.dataset.day;$('newStart').value=el.dataset.time;$('newEnd').value=clock(Math.min(1320,minutes(el.dataset.time)+30));$('dialog').showModal()});detail()}
function detail(){const s=slots.find(s=>s.id===selected);if(!s){$('detail').innerHTML='<h3>Termin auswählen</h3><p class="muted">Auf eine farbige Hallenzeit tippen.</p>';return}let interested=apps.filter(a=>a.slot_id===s.id).map(a=>a.team);let html='<h3>'+halls[s.hall]+'</h3><p>'+s.day+' · '+s.start_time.slice(0,5)+'–'+clock(minutes(s.start_time)+30)+'</p><p>'+(s.assigned_team?'Zugewiesen: '+names[s.assigned_team]:'Noch nicht vergeben')+'</p><h4>Bewerbungen</h4>'+teams.map(t=>'<div class="row"><span>'+names[t]+'</span><span>'+(interested.includes(t)?'✓':'–')+'</span></div>').join('');if(profile.role==='admin'){html+='<label>Zuteilen <select id="assign"><option value="">Nicht vergeben</option>'+teams.map(t=>'<option value="'+t+'" '+(s.assigned_team===t?'selected':'')+'>'+names[t]+'</option>').join('')+'</select></label><button id="assignBtn" class="primary">Zuteilen</button> <button id="removeBtn" class="danger">Löschen</button>'}else html+='<button id="applyBtn" class="primary" '+(s.assigned_team&&s.assigned_team!==profile.team?'disabled':'')+'>'+(interested.includes(profile.team)?'Bewerbung zurückziehen':'Für 30 Minuten bewerben')+'</button>';$('detail').innerHTML=html;
if(profile.role==='admin'){$('assignBtn').onclick=async()=>{const r=await db.from('slots').update({assigned_team:$('assign').value||null}).eq('id',s.id);if(r.error)fail(r.error);else await refresh()};$('removeBtn').onclick=async()=>{if(!confirm('Diese halbe Stunde samt Bewerbungen löschen?'))return;const r=await db.from('slots').delete().eq('id',s.id);if(r.error)fail(r.error);else{selected=null;await refresh()}}}else $('applyBtn').onclick=async()=>{const r=interested.includes(profile.team)?await db.from('applications').delete().eq('slot_id',s.id).eq('team',profile.team):await db.from('applications').insert({slot_id:s.id,team:profile.team});if(r.error)fail(r.error);else await refresh()}}
function stats(){let f=slots.filter(s=>s.assigned_team&&($('statHall').value==='all'||s.hall===$('statHall').value)&&($('statPeriod').value==='all'||monday(s.day)===week)),values=teams.map(t=>({t,h:f.filter(s=>s.assigned_team===t).length/2})),max=Math.max(1,...values.map(v=>v.h));$('stats').innerHTML='<h3>Gesamt: '+f.length/2+' Stunden</h3>'+values.map(v=>'<div class="row"><b>'+names[v.t]+'</b><b>'+v.h+' Std.</b></div><div class="bar"><div class="fill" style="width:'+(v.h/max*100)+'%"></div></div>').join('')}
$('prev').onclick=()=>{week=add(week,-7);selected=null;render()};$('next').onclick=()=>{week=add(week,7);selected=null;render()};$('start').onclick=()=>{week=START;render()};$('showStats').onclick=()=>{view='stats';render()};$('showCalendar').onclick=()=>{view='calendar';render()};$('reload').onclick=refresh;$('statHall').onchange=stats;$('statPeriod').onchange=stats;$('add').onclick=()=>{$('newDate').value=week;$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();
$('addForm').onsubmit=async e=>{e.preventDefault();let d=$('newDate').value,h=$('newHall').value,a=minutes($('newStart').value),b=minutes($('newEnd').value);if(d<START||d>END||a<840||b>1320||a>=b||a%30||b%30){alert('Bitte 30-Minuten-Schritte zwischen 14 und 22 Uhr innerhalb der Saison wählen.');return}let rows=[];for(let t=a;t<b;t+=30)rows.push({day:d,hall:h,start_time:clock(t)});let r=await db.from('slots').upsert(rows,{onConflict:'day,hall,start_time',ignoreDuplicates:true});if(r.error)fail(r.error);else{$('dialog').close();week=monday(d);await refresh()}};
$('deleteWeek').onclick=async()=>{if(!confirm('Alle Termine und Bewerbungen dieser Woche unwiderruflich löschen?'))return;const r=await db.from('slots').delete().gte('day',week).lte('day',add(week,6));if(r.error)fail(r.error);else{selected=null;await refresh()}};
$('csv').onclick=()=>{let data=[['Datum','Halle','Beginn','Zuteilung'],...slots.map(s=>[s.day,halls[s.hall],s.start_time,names[s.assigned_team]||''])],csv='\ufeff'+data.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='hallenplaner.csv';a.click();URL.revokeObjectURL(url)};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(ready){db.auth.onAuthStateChange(()=>setTimeout(authenticate,0));authenticate()}else msg('Noch nicht eingerichtet: Supabase URL und Publishable Key in config.js eintragen.');
</script></body></html>
